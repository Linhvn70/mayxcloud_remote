name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository + submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify submodules
        run: |
          echo "=== JNI ==="
          ls -la app/src/main/jni || true

          echo "=== moonlight-core ==="
          ls -la app/src/main/jni/moonlight-core || true

          echo "=== moonlight-common-c ==="
          ls -la app/src/main/jni/moonlight-core/moonlight-common-c || true

          echo "=== moonlight-common-c/src ==="
          ls -la app/src/main/jni/moonlight-core/moonlight-common-c/src || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.3.11579264"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MayXCloud-Remote
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
